<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Four-layer architecture of the Agentic Database Health Monitor</title>
<desc>Telemetry collectors feed cross-engine normalization, which feeds an agentic reasoning core, which drives graduated notification and action, with a dashed human-feedback loop back into historical baselines.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.th{font-size:14px;font-weight:700;}
.ts{font-size:12px;font-weight:400;}
.hdr{font-size:14px;font-weight:700;fill:#2C2C2A;}
.container{fill:#FFFFFF;stroke:#9C9A92;stroke-width:1;stroke-dasharray:6,4;}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none;}
.leader{stroke:#9C9A92;stroke-width:1;stroke-dasharray:3,3;fill:none;}
</style>

<rect x="40" y="40" width="580" height="100" rx="6" class="container"/>
<text x="330" y="60" text-anchor="middle" class="hdr">Layer 1 — telemetry collectors</text>
<g><rect x="48" y="75" width="130" height="45" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="113" y="93" text-anchor="middle" class="th" fill="#2C2C2A">Oracle</text><text x="113" y="111" text-anchor="middle" class="ts" fill="#444441">V$ views</text></g>
<g><rect x="193" y="75" width="130" height="45" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="258" y="93" text-anchor="middle" class="th" fill="#2C2C2A">PostgreSQL</text><text x="258" y="111" text-anchor="middle" class="ts" fill="#444441">pg_stat views</text></g>
<g><rect x="338" y="75" width="130" height="45" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="403" y="93" text-anchor="middle" class="th" fill="#2C2C2A">MySQL/InnoDB</text><text x="403" y="111" text-anchor="middle" class="ts" fill="#444441">INNODB STATUS</text></g>
<g><rect x="483" y="75" width="130" height="45" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="548" y="93" text-anchor="middle" class="th" fill="#2C2C2A">SQL Server</text><text x="548" y="111" text-anchor="middle" class="ts" fill="#444441">DMVs</text></g>

<line x1="330" y1="140" x2="330" y2="160" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="160" width="580" height="100" rx="6" class="container"/>
<text x="330" y="180" text-anchor="middle" class="hdr">Layer 2 — cross-engine normalization</text>
<g><rect x="48" y="195" width="130" height="45" rx="4" fill="#E6F1FB" stroke="#185FA5"/><text x="113" y="213" text-anchor="middle" class="th" fill="#0C447C">Blocking chain</text><text x="113" y="231" text-anchor="middle" class="ts" fill="#185FA5">lock waits</text></g>
<g><rect x="193" y="195" width="130" height="45" rx="4" fill="#E6F1FB" stroke="#185FA5"/><text x="258" y="213" text-anchor="middle" class="th" fill="#0C447C">Undo pressure</text><text x="258" y="231" text-anchor="middle" class="ts" fill="#185FA5">undo/history list</text></g>
<g><rect x="338" y="195" width="130" height="45" rx="4" fill="#E6F1FB" stroke="#185FA5"/><text x="403" y="213" text-anchor="middle" class="th" fill="#0C447C">Deadlock event</text><text x="403" y="231" text-anchor="middle" class="ts" fill="#185FA5">resource cycle</text></g>
<g><rect x="483" y="195" width="130" height="45" rx="4" fill="#E6F1FB" stroke="#185FA5"/><text x="548" y="213" text-anchor="middle" class="th" fill="#0C447C">Wait events</text><text x="548" y="231" text-anchor="middle" class="ts" fill="#185FA5">top-N profile</text></g>

<line x1="330" y1="260" x2="330" y2="280" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="280" width="580" height="100" rx="6" class="container"/>
<text x="330" y="300" text-anchor="middle" class="hdr">Layer 3 — agentic reasoning core</text>
<g><rect x="50" y="315" width="265" height="45" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="182" y="333" text-anchor="middle" class="th" fill="#3C3489">LLM reasoning agent</text><text x="182" y="351" text-anchor="middle" class="ts" fill="#534AB7">ReAct loop + MCP tools</text></g>
<g><rect x="345" y="315" width="265" height="45" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="477" y="333" text-anchor="middle" class="th" fill="#3C3489">Historical baselines</text><text x="477" y="351" text-anchor="middle" class="ts" fill="#534AB7">SQLite + human feedback</text></g>

<line x1="330" y1="380" x2="330" y2="400" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="400" width="580" height="110" rx="6" class="container"/>
<text x="330" y="420" text-anchor="middle" class="hdr">Layer 4 — graduated notification &amp; action</text>
<g><rect x="48" y="435" width="130" height="50" rx="4" fill="#FAECE7" stroke="#993C1D"/><text x="113" y="455" text-anchor="middle" class="th" fill="#712B13">Log only</text><text x="113" y="473" text-anchor="middle" class="ts" fill="#993C1D">trend only</text></g>
<g><rect x="193" y="435" width="130" height="50" rx="4" fill="#FAECE7" stroke="#993C1D"/><text x="258" y="455" text-anchor="middle" class="th" fill="#712B13">Low-urgency</text><text x="258" y="473" text-anchor="middle" class="ts" fill="#993C1D">digest email</text></g>
<g><rect x="338" y="435" width="130" height="50" rx="4" fill="#FAECE7" stroke="#993C1D"/><text x="403" y="455" text-anchor="middle" class="th" fill="#712B13">High-urgency</text><text x="403" y="473" text-anchor="middle" class="ts" fill="#993C1D">immediate page</text></g>
<g><rect x="483" y="435" width="130" height="50" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-dasharray="4,3"/><text x="548" y="455" text-anchor="middle" class="th" fill="#712B13">Bounded action</text><text x="548" y="473" text-anchor="middle" class="ts" fill="#993C1D">opt-in only</text></g>

<path d="M620,460 H632 V340 H620" class="leader" marker-end="url(#arrow)"/>

<rect x="99" y="528" width="14" height="14" rx="2" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="117" y="539" class="ts" fill="#2C2C2A">Telemetry</text>
<rect x="205" y="528" width="14" height="14" rx="2" fill="#E6F1FB" stroke="#185FA5"/>
<text x="223" y="539" class="ts" fill="#2C2C2A">Normalization</text>
<rect x="339" y="528" width="14" height="14" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
<text x="357" y="539" class="ts" fill="#2C2C2A">Reasoning core</text>
<rect x="480" y="528" width="14" height="14" rx="2" fill="#FAECE7" stroke="#993C1D"/>
<text x="498" y="539" class="ts" fill="#2C2C2A">Notification</text>
</svg>
